name: generate-snake-animation

on:
  schedule:
    - cron: "0 2 * * *"   # Jalan otomatis tiap hari jam 02:00 UTC
  workflow_dispatch:        # Supaya bisa dijalankan manual dari tab "Actions"
  push:
    branches:
      - main                # Sesuaikan jika branch utama menggunakan "main"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # Menggunakan PAT agar dapat membaca statistik kontribusi dari semua repo publik
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
